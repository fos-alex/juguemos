# Deploys main to the dev environment at https://dev.ludi.ar on every push.
#
# Setup (once): in the repo's Settings → Secrets → Actions, add LUDI_DEV_SSH_KEY
# with the private key whose public half is in the droplet's
# /root/.ssh/authorized_keys. The droplet keeps /var/www/ludi-dev's .env and
# docker-compose.dev-server.yml untracked, so pulling never touches them.

name: Deploy dev

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and rebuild on the droplet
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LUDI_DEV_SSH_KEY }}" > ~/.ssh/dev_deploy
          chmod 600 ~/.ssh/dev_deploy
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/dev_deploy root@147.182.129.173 \
            "cd /var/www/ludi-dev && git fetch origin && git reset --hard origin/main && docker compose -p ludi-dev up -d --build && n=0; until curl -sf --max-time 10 http://127.0.0.1:3081/api/health; do n=$((n+1)); [ $n -ge 24 ] && exit 1; sleep 5; done"
