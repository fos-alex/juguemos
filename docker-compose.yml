name: juguemos

services:
  # Serves the web app, which its image builds (caddy/Dockerfile), and proxies
  # /api to the API. `docker compose up --build` rebuilds both.
  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:443"
      - "127.0.0.1:3001:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Applies pending migrations and loads catalog templates the database doesn't
  # have yet, then exits. Every `docker compose up` runs it after building and
  # before the API starts; running it again is a no-op.
  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["sh", "-c", "node api/src/migrate.js && node api/src/seed.js catalog"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-juguemos}:${POSTGRES_PASSWORD:-juguemos}@db:5432/${POSTGRES_DB:-juguemos}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-juguemos}:${POSTGRES_PASSWORD:-juguemos}@db:5432/${POSTGRES_DB:-juguemos}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://juguemos.local:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
      SIGNUP_EMAILS: ${SIGNUP_EMAILS:-}
      # Which LLM writes the stories (opencode or openrouter), its model, and
      # the providers' keys. Without the chosen provider's key, stories come
      # from templates. OPENCODE_MODEL is the old name for LLM_MODEL.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # How many episodes a story series holds (JUG-59).
      STORY_SERIES_EPISODES: ${STORY_SERIES_EPISODES:-}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-false}
      AUDIT_TRANSCRIPTS: ${AUDIT_TRANSCRIPTS:-false}
      # Speech to text for voice notes: the stt service below, unless .env
      # points at a hosted one with its model and key.
      STT_URL: ${STT_URL:-http://stt:8000/v1}
      STT_MODEL: ${STT_MODEL:-}
      STT_API_KEY: ${STT_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Whisper (faster-whisper, through speaches) behind the OpenAI transcriptions
  # API, for voice notes. Only the API reaches it, and it keeps no audio: each
  # note is transcribed in memory and dropped, and nothing is logged below
  # warnings. Before the server starts, the model is downloaded into
  # stt_models (about 1.6 GB, once; later starts find it there), fetching the
  # same files speaches itself would. The model is unloaded after ten idle
  # minutes to free memory, so the first note after that waits a few seconds
  # longer while it loads again.
  stt:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        huggingface-cli download deepdml/faster-whisper-large-v3-turbo-ct2
        config.json preprocessor_config.json model.bin tokenizer.json vocabulary.json README.md > /dev/null
        && exec uvicorn --factory speaches.main:create_app
    environment:
      WHISPER__TTL: "600"
      WHISPER__COMPUTE_TYPE: int8
      ENABLE_UI: "false"
      LOG_LEVEL: warning
    volumes:
      - stt_models:/home/ubuntu/.cache/huggingface/hub

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-juguemos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juguemos}
      POSTGRES_DB: ${POSTGRES_DB:-juguemos}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juguemos} -d ${POSTGRES_DB:-juguemos}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  caddy_data:
  caddy_config:
  db_data:
  stt_models:
