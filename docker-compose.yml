name: juguemos

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./web/dist:/srv:ro
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-juguemos}:${POSTGRES_PASSWORD:-juguemos}@db:5432/${POSTGRES_DB:-juguemos}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-juguemos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juguemos}
      POSTGRES_DB: ${POSTGRES_DB:-juguemos}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juguemos} -d ${POSTGRES_DB:-juguemos}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  caddy_data:
  caddy_config:
  db_data:
