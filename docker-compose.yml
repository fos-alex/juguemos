name: juguemos

services:
  # Serves the web app, which its image builds (caddy/Dockerfile), and proxies
  # /api to the API. `docker compose up --build` rebuilds both.
  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:443"
      - "127.0.0.1:3001:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Applies pending migrations and loads catalog templates the database doesn't
  # have yet, then exits. Every `docker compose up` runs it after building and
  # before the API starts; running it again is a no-op.
  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["sh", "-c", "node api/src/migrate.js && node api/src/seed.js catalog"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-juguemos}:${POSTGRES_PASSWORD:-juguemos}@db:5432/${POSTGRES_DB:-juguemos}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-juguemos}:${POSTGRES_PASSWORD:-juguemos}@db:5432/${POSTGRES_DB:-juguemos}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://juguemos.local:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
      SIGNUP_EMAILS: ${SIGNUP_EMAILS:-}
      # Which LLM writes the stories (opencode or openrouter), its model, and
      # the providers' keys. Without the chosen provider's key, stories come
      # from templates. OPENCODE_MODEL is the old name for LLM_MODEL.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-false}
      AUDIT_TRANSCRIPTS: ${AUDIT_TRANSCRIPTS:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-juguemos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juguemos}
      POSTGRES_DB: ${POSTGRES_DB:-juguemos}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juguemos} -d ${POSTGRES_DB:-juguemos}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  caddy_data:
  caddy_config:
  db_data:
